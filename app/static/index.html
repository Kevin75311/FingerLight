<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finger Light</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <div class="screen" id="screen">
    <div class="top">
      <div class="tabs" id="tabs">
        <button class="tab" data-go="library">Library</button>
        <button class="tab" data-go="play">Play</button>
        <button class="tab" data-go="session">Session</button>
        <button class="tab" data-go="free">Free play</button>
        <button class="tab" data-go="settings">Settings</button>
      </div>
      <div class="spacer"></div>
      <div id="pills" style="display:flex;gap:8px"></div>
    </div>
    <div id="view" style="min-height:0; position:relative"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
